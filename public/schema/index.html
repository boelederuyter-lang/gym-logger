<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Maak in een paar tikken een persoonlijk trainingsschema van 4 weken." />
    <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Schema" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Trainingsschema</title>
    <script>
      // Thema vóór de eerste render zetten, zodat er niets knippert.
      try {
        var t = localStorage.getItem('trainingsschema.thema');
        if (t === 'licht') document.documentElement.dataset.theme = 'light';
        if (t === 'donker') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="5" y="6" width="3.5" height="12" rx="1"/><rect x="8" y="11" width="8" height="2"/><rect x="15.5" y="6" width="3.5" height="12" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/></svg>
        </span>
        <span>Trainingsschema</span>
      </div>
      <button class="icon-btn" id="thema-knop" type="button" aria-label="Thema wisselen"></button>
    </header>

    <main id="app" class="wrap">
      <noscript><p class="card">Zet JavaScript aan om je schema te maken.</p></noscript>
    </main>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
